<style>@page { size: 69mm 94mm; margin: 0; }
html, body { width: 69mm; }
.sheet { position: relative; width: 69mm; height: 94mm; overflow: hidden; page-break-after: always; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: 'Archivo', sans-serif; color: #F4F0E6; }

.card { position:relative; width:69mm; height:94mm; background:#0B0B0C; overflow:hidden; color:#F4F0E6; }
.card .fr { position:absolute; inset:0; }
.card .in { position:absolute; left:8mm; top:8mm; width:53mm; height:78mm; display:flex; flex-direction:column; }
.hd { display:flex; justify-content:space-between; align-items:center; height:6mm; padding:0 1.6mm; background:var(--c); color:var(--t); }
.hd .pix { font-size:6pt; display:flex; align-items:center; gap:1mm; }
.hd .mono { font-size:6pt; font-weight:700; }
.mn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1.5mm; }
.ttl { font-family:'Bungee'; font-size:12pt; line-height:1.05; }
.term { width:100%; border:.4mm solid #F4F0E6; background:#232327; padding:2.5mm 2mm; text-align:left; }
.term .bar { font-family:'Silkscreen'; font-size:4.6pt; color:#8C877D; margin-bottom:1.5mm; }

.lbl { font-family:'Silkscreen'; font-size:5.5pt; color:#8C877D; }
.bd { font-size:7.5pt; line-height:1.3; text-align:center; padding:0 .5mm; }
.ex { font-family:'IBM Plex Mono'; font-size:6.4pt; background:#232327; padding:1.2mm 1.5mm; margin-top:1.5mm; text-align:center; }
.cols { display:flex; width:100%; border:.4mm solid #F4F0E6; }
.cols span { flex:1; font-family:'IBM Plex Mono'; font-size:6pt; font-weight:700; padding:1.2mm .5mm; text-align:center; }
.cols span + span { border-left:.4mm solid #F4F0E6; }
.rows { width:100%; }
.rows i { display:block; height:2.2mm; margin-top:1mm; background:#232327; }
.rows i.hit { background:#E31B3B; }
.big { font-family:'Bungee'; font-size:40pt; line-height:.9; }
.ft { display:flex; align-items:flex-end; gap:2.5mm; margin-top:2mm; min-height:15mm; }
.qr { width:15mm; height:15mm; flex:none; }
.qr svg { width:100%; height:100%; display:block; }
.ft .meta { display:flex; flex-direction:column; gap:.8mm; flex:1; }
.ft .code { font-family:'IBM Plex Mono'; font-weight:700; font-size:9pt; }
.ft .deck { font-family:'Silkscreen'; font-size:5pt; color:#8C877D; display:flex; gap:1mm; align-items:center; }
.ft.noqr { min-height:9mm; justify-content:space-between; align-items:center; border-top:.3mm solid #232327; padding-top:1.5mm; }
/* backs */
.back .in { align-items:center; justify-content:center; gap:4mm; }
.back img { width:47mm; }
.back .rib { background:#E31B3B; color:#F4F0E6; font-family:'Bungee'; font-size:9pt; padding:1.4mm 4mm; display:flex; gap:1.5mm; align-items:center; }
